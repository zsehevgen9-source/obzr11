\"drop\">\u003c/div>';\nc.ondragover=e=>{e.preventDefault();c.classList.add('over')};c.ondragleave=()=>c.classList.remove('over');\nc.ondrop=e=>{e.preventDefault();c.classList.remove('over');if(sel){c.querySelector('.drop').appendChild(sel);sel=null}};\nc.onclick=()=>{if(sel){c.querySelector('.drop').appendChild(sel);sel.style.outline='';sel=null}};cols.appendChild(c)});\nshuffle(D.threats).forEach(([n,g])=>{const e=document.createElement('div');e.className='chip';e.textContent=n;e.dataset.g=g;e.draggable=true;\ne.ondragstart=()=>{sel=e};e.onclick=ev=>{ev.stopPropagation();if(sel)sel.style.outline='';sel=e;e.style.outline='3px solid #FFD21F'};pool.appendChild(e)})}\ndocument.getElementById('check').onclick=()=>{let ok=0,tot=D.threats.length;document.querySelectorAll('.chip').forEach(c=>{c.classList.remove('ok','bad');const p=c.parentElement;if(p.classList.contains('drop')){if(p.parentElement.dataset.g===c.dataset.g){c.classList.add('ok');ok++}else c.classList.add('bad')}});\ndocument.getElementById('res1').textContent='Верно: '+ok+' из '+tot+(ok===tot?' — отлично! 🎉':'  (красные — ошибки, перенеси их)')};\ndocument.getElementById('reset').onclick=build;build();\n// --- quiz\nconst qz=document.getElementById('quiz');let score=0,done=0;\nfunction buildQ(){qz.innerHTML='';score=0;done=0;document.getElementById('res2').textContent='';\nD.quiz.forEach((q,i)=>{const w=document.createElement('div');w.className='q';w.innerHTML='\u003ch4>'+(i+1)+'. '+q.q+'\u003c/h4>';\nconst o=shuffle(q.a.map((t,j)=>j));o.forEach((j,k)=>{const t=q.a[j];const b=document.createElement('button');b.className='opt';b.textContent='абвг'[k]+') '+t;b.onclick=()=>{if(w.dataset.d)return;w.dataset.d=1;done++;if(j===q.c){b.classList.add('ok');score++}else{b.classList.add('bad');w.querySelectorAll('.opt')[o.indexOf(q.c)].classList.add('ok')}\nif(done===D.quiz.length){const r=score/D.quiz.length;document.getElementById('res2').textContent='Результат: '+score+' из '+D.quiz.length+' — оценка «'+(r>=.83?5:r>=.66?4:r>=.5?3:2)+'»'}};w.appendChild(b)});qz.appendChild(w)})}\ndocument.getElementById('qreset').onclick=buildQ;buildQ();\n\u003c/script>\u003c/body>\u003c/html>"}</script><script>const l=new URLSearchParams(location.search).get("l")||"1";document.open();document.write(JSON.parse(document.getElementById("d").textContent)[l]||"Нет такого урока");document.close()</script>
